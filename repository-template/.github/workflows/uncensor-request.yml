name: Uncensor Cloud Issue Request

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: uncensor-issue-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  request:
    if: startsWith(github.event.issue.body, 'stupidcensor-request-v1')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch worker
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install metadata dependencies
        run: python -m pip install --disable-pip-version-check -r cloud/requirements.txt

      - name: Process issue request
        env:
          ACTION: request
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PYTHONUNBUFFERED: "1"
        run: python cloud/uncensor_worker.py
